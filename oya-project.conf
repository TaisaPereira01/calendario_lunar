# oya-project.conf — Planner Lunar Integrativo
# Configuração canônica do projeto para o Oya Agentic Framework v3.47+
#
# Criado na Etapa 1.4 (decisão de perfil) e expandido na Etapa 1.8 (Lote Oya).
# Fonte de verdade das flags que o `ativar.bat` e os slash commands consomem.
# =============================================================================

# --- Identidade ---
OYA_PROJECT_NAME=Planner Lunar Integrativo
OYA_PROJECT_SLUG=calendario_lunar
OYA_FRAMEWORK_APPLIED=3.47.1
OYA_AGENT_TOOL=claude_code

# --- Perfil ---
OYA_PROFILE=lite
OYA_RTM=no

# --- Dimensão 6 (contexto técnico do produto) ---
OYA_HAS_UI=yes
OYA_HAS_STREAMLIT=yes
OYA_HAS_E2E_BROWSER=no
OYA_HAS_DB=yes
OYA_HAS_LLM=no
OYA_HAS_DOMAIN_LOGIC=yes
OYA_COVERAGE_MIN=60
OYA_VENV_PATH=C:\venvs\calendario_lunar\

# --- Git ---
OYA_HAS_GIT=yes
OYA_HAS_GITHUB=yes
OYA_GIT_AUTO_COMMIT=yes
OYA_GIT_STRATEGY=main-only
OYA_GIT_REMOTE=https://github.com/TaisaPereira01/calendario_lunar.git
